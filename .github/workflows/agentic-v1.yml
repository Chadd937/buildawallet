name: BuildAWallet CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile main.py agent_protocol.py chains.py evm.py solana_adapter.py utxo_adapter.py pricing.py wallet_crypto.py mcp_server.py app/brain.py app/catalog.py
      - name: Test
        run: pytest -q
      - name: Ensure no database is tracked
        run: test -z "$(git ls-files 'data/*.db*')"
  machine-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-pay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-pay/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run typecheck && npm test
      - name: Check Wrangler bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run
  android-studio-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build offline design preview
        working-directory: android-studio
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: buildawallet-studio-preview-not-a-wallet
          path: android-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
