name: Android Wallet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-studio/**"
      - ".github/workflows/android-wallet.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.BAW_ANDROID_KEYSTORE_B64 }}
      STORE_PASSWORD: ${{ secrets.BAW_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.BAW_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.BAW_ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: gradle -p android-studio :app:testDebugUnitTest

      - name: Build APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          if [[ -n "${KEYSTORE_B64}" && -n "${STORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/buildawallet-release.jks"
            export BAW_ANDROID_KEYSTORE="${RUNNER_TEMP}/buildawallet-release.jks"
            export BAW_ANDROID_KEYSTORE_PASSWORD="${STORE_PASSWORD}"
            export BAW_ANDROID_KEY_ALIAS="${KEY_ALIAS}"
            export BAW_ANDROID_KEY_PASSWORD="${KEY_PASSWORD}"

            gradle -p android-studio :app:assembleRelease
            cp android-studio/app/build/outputs/apk/release/app-release.apk out/BuildAWallet-Wallet.apk
            sha256sum out/BuildAWallet-Wallet.apk | tee out/BuildAWallet-Wallet.apk.sha256
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            gradle -p android-studio :app:assembleDebug
            cp android-studio/app/build/outputs/apk/debug/app-debug.apk out/BuildAWallet-Wallet-debug.apk
            sha256sum out/BuildAWallet-Wallet-debug.apk | tee out/BuildAWallet-Wallet-debug.apk.sha256
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: buildawallet-android
          path: out/*
          if-no-files-found: error

      - name: Publish signed latest release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            out/BuildAWallet-Wallet.apk \
            out/BuildAWallet-Wallet.apk.sha256 \
            --target "${GITHUB_SHA}" \
            --title "BuildAWallet Android Wallet v1" \
            --notes "Owner-signed BuildAWallet HUMAN Android wallet. Verify the SHA-256 asset before installation."
