name: Apply Android v1 patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_android_v1.py.gz"
      - ".github/workflows/apply-android-v1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply generated patch
        run: |
          set -euo pipefail
          gzip -dc scripts/apply_android_v1.py.gz > /tmp/apply_android_v1.py
          python3 /tmp/apply_android_v1.py
          rm -f scripts/apply_android_v1.py.gz .github/workflows/apply-android-v1.yml

      - name: Commit final Android wallet v1
        run: |
          set -euo pipefail
          git config user.name "BuildAWallet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish HUMAN Android wallet v1"
          git push origin HEAD:main
