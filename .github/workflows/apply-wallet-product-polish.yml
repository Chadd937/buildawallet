name: Apply wallet product polish

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_wallet_product_polish.py"
      - ".github/workflows/apply-wallet-product-polish.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply wallet UI patch
        run: python3 scripts/apply_wallet_product_polish.py

      - name: Remove one-shot patch files
        run: rm -f scripts/apply_wallet_product_polish.py .github/workflows/apply-wallet-product-polish.yml

      - name: Commit wallet product polish
        run: |
          set -euo pipefail
          git config user.name "BuildAWallet Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish Web3 wallet desktop and Android UI"
          git push origin HEAD:main
