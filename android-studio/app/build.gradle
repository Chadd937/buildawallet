plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('BAW_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('BAW_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('BAW_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('BAW_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'xyz.buildawallet.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'xyz.buildawallet.wallet'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // Web3j's Android AARs deliberately publish without a transitive dependency
    // graph, so the modules/runtime libraries used by core + crypto are explicit.
    implementation 'org.web3j:core:4.12.3-android'
    implementation 'org.web3j:crypto:4.12.3-android'
    implementation 'org.web3j:utils:4.12.3-android'
    implementation 'org.web3j:rlp:4.12.3-android'
    implementation 'org.web3j:abi:4.12.3-android'
    implementation 'org.web3j:tuples:4.12.3-android'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'io.github.adraffy:ens-normalize:0.2.0'
    implementation 'io.tmio:tuweni-bytes:2.4.2'
    implementation 'io.tmio:tuweni-units:2.4.2'

    testImplementation 'junit:junit:4.13.2'
}
